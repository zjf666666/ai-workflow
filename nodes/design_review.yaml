id: design_review
type: pi_review
executionMode: interactive
# Review is autonomous (no user input expected): auto-close after one turn.
autoAdvance: true
input:
  - design
output:
  type: design_review_result
target: generate_design
maxReworkAttempts: 3
onExhausted: HUMAN_INTERVENTION_REQUIRED
batchTimeoutSeconds: 1200
